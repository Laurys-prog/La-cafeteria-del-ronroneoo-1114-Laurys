<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Menú digital de La Cafetería del Ronroneoo">
  <title>La Cafetería del Ronroneoo | Menú</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Menú digital</p>
    <h1>La Cafetería del Ronroneoo</h1>
    <p>Elige tus productos y revisa tu comanda antes de confirmarla.</p>
  </header>
  <main class="layout">
    <section aria-labelledby="menu-title">
      <h2 id="menu-title">Nuestro menú</h2>
      <div id="product-list" class="product-grid"></div>
    </section>
    <aside class="cart" aria-labelledby="cart-title">
      <p class="eyebrow">Comanda actual</p>
      <h2 id="cart-title">Carrito <span id="cart-count" aria-label="productos en el carrito">0</span></h2>
      <ul id="cart-list"></ul>
      <div class="cart-total"><span>Total</span><strong id="cart-total">$0</strong></div>
      <button class="confirm" type="button" disabled title="La confirmación se implementará en un siguiente incremento">Confirmar pedido (próximamente)</button>
    </aside>
  </main>
  <footer>Proyecto educativo — MVP de menú y carrito local.</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
